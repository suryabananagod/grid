<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .grid-item1 {grid-area: header;}
        .grid-item2 {grid-area: menu;}
        .grid-item3 {grid-area: main content;}
        .grid-item4 {grid-area: footer;}
        .grid-container {
            display: grid;
            grid-template-areas:
                'header header header'
                'menu main content'
                'footer footer footer';
            gap: 30px;
            background-color: rgb(2, 190, 252);
            padding: 20px;
        }
        .grid-container div {
            background-color: rgb(12, 252, 4);
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr; 
            grid-template-rows: auto auto auto auto auto;
            gap: 30px;
            background-color: rgb(2, 190, 252);
            padding: 20px;
        }

        .grid-item1 {
            background-color: rgb(12, 252, 4);
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .grid-item2 {
            background-color: rgb(12, 252, 4);
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .grid-item3 {
            background-color: rgb(12, 252, 4);
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .grid-item4 {
            background-color: rgb(12, 252, 4);
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
    <div class="grid-container">
        <div class="grid-item1">header</div>
        <div class="grid-item2">menu</div>
        <div class="grid-item3">main content</div>
        <div class="grid-item4">footer</div>
    </div>
</body>
</html>
